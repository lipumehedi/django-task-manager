
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if task %}Edit Task{% else %}Add Task{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="mb-4">
                {% if task %}Edit Task{% else %}Create a Task{% endif %}
            </h1>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="title" class="form-label">Task Title</label>
                    <input
                        id="title"
                        type="text"
                        name="title"
                        class="form-control"
                        maxlength="200"
                        value="{{ task.title|default:'' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ task.description|default:'' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    {% if task %}Update Task{% else %}Save Task{% endif %}
                </button>

                <a href="{% url 'task_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
